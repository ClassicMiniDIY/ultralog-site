name: Deploy to Cloudflare

# Inert until the repo exists on GitHub and the secrets below are set (see docs/plans/2026-10-24-ultralog-site.md).
on:
  push:
    branches: [main]
  # Sent by the UltraLog app repo after a release's assets upload, and when its notes are edited.
  repository_dispatch:
    types: [app-release]
  workflow_dispatch:
  # Backstop for a missed dispatch.
  schedule:
    - cron: '17 6 * * *'

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      # Every route is prerendered here, including the GitHub releases and the wiki/OECUA ECU data.
      # A failed releases fetch fails this step, so a deploy never ships without downloads.
      - name: Generate
        run: bun run generate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          wranglerVersion: '4.152.0'
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke test
        env:
          TARGET: https://ultralog-site.classicminidiy.workers.dev
        run: |
          set -euo pipefail
          for path in / /download /releases /docs /ecus /ecus/haltech /sitemap.xml; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -m 30 "$TARGET$path")
            echo "$path -> $code"
            [ "$code" = 200 ] || exit 1
          done
