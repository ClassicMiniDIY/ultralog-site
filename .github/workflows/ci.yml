name: CI

# Pull request build. deploy.yml only runs on main, dispatch and schedule, so without this a PR
# merges with no build at all. Same install and generate steps as the deploy, nothing deployed.
on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The site ships as `nuxt generate` output, so that is the build to check.
      - name: Generate
        run: bun run generate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
